<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>短剧高光 · 实际预测</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172337;font:15px/1.6 system-ui,sans-serif}header{padding:25px 32px;background:#fff;border-bottom:1px solid #dae1e9}h1{font-size:24px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}.muted{color:#69788c;font-size:13px}.metrics{display:flex;gap:24px;flex-wrap:wrap;margin:16px 0}.metric strong{display:block;font-size:24px;color:#173f86}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;padding:24px;max-width:1550px;margin:auto}aside,article{background:#fff;border:1px solid #dce3ed;border-radius:12px;padding:16px}select,input,button{font:inherit;border:1px solid #cdd7e3;background:white;border-radius:7px;padding:7px 10px}select,input{width:100%;margin-bottom:8px}button{cursor:pointer;margin:3px}button:hover{background:#eef3fb}#list{max-height:740px;overflow:auto}.row{display:block;text-align:left;width:100%;margin:4px 0;font-size:13px}.row.active{border-color:#285cb3;background:#eef4ff}video{width:100%;max-height:470px;background:#111;border-radius:8px}.spans{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 0}.reference{border-color:#318769;color:#206d50}.prediction{border-color:#4073b5;color:#24538f}.bad{border-color:#bf6c6c;color:#9d4040}pre{white-space:pre-wrap;word-break:break-word;background:#f6f8fb;padding:12px;font-size:13px}details{margin-top:12px}#status{margin:10px 0;color:#385471}table{border-collapse:collapse;font-size:13px}td,th{padding:6px 15px;border-bottom:1px solid #dce3ed;text-align:left}@media(max-width:800px){.layout{grid-template-columns:1fr;padding:12px}#list{max-height:260px}.spans{grid-template-columns:1fr}header{padding:18px}}
</style>
<header><h1>模型实际选出了什么</h1><div class="muted" id="intro"></div><div id="metrics" class="metrics"></div>
<details><summary>不同重叠标准下的结果与计算口径</summary><table id="scores"></table><p class="muted">对固定测试窗口的原始区间做一对一匹配，不修补模型输出。IoU 是预测与参考区间的时间交集除以并集。精彩核心召回按预测覆盖至少 80% 参考核心一对一匹配；同时报告区间 IoU，避免用过长片段虚增核心覆盖。边界误差只统计 IoU ≥ 0.5 的匹配。格式错误窗口的参考高光计为漏选；格式错误率单列。这里只评估已冻结的测试窗口，参考标注来自当前数据集。</p></details></header>
<div class="layout"><aside><h2>逐段查看</h2><select id="category"><option value="">全部结果</option></select><select id="drama"><option value="">全部剧集</option></select><input id="search" placeholder="搜索视频或对白"><div id="count" class="muted"></div><div id="list"></div></aside>
<article><h2 id="title"></h2><div id="meta" class="muted"></div><video id="video" controls preload="metadata"></video><div id="status"></div><div class="muted">样例视频：绿色 REF 表示参考高光，蓝色 MODEL 表示模型预测。</div><button id="context">播放完整观看窗口</button><div class="spans"><section><h2>参考高光</h2><div id="reference"></div></section><section><h2>模型预测</h2><div id="predictions"></div></section></div><details open><summary>实际输入的对白</summary><pre id="dialogue"></pre></details><details><summary>模型原始输出（使用窗口相对秒数；按钮显示原片位置）</summary><pre id="raw"></pre></details></article></div>
<script>
const report=__REPORT_DATA__, rows=report.details, m=report.metrics, $=id=>document.getElementById(id), pct=x=>(x*100).toFixed(1)+'%', sec=x=>x.toFixed(2)+'s';
$('intro').textContent=`最终 LoRA · ${m.windows} 个窗口 · ${m.videos} 个视频 · ${m.dramas} 部独立剧。点击时间区间观看原片；侧栏包括成功与失败结果。`;
const top=m.iou['0.5'];
for(const [name,value] of [['精彩核心召回',pct(m.core_capture.recall)],['召回率 · IoU≥0.5',pct(top.recall)],['预测精确率',pct(top.precision)],['空窗误报率',pct(m.empty_window_false_positive_rate)],['JSON 格式有效率',pct(m.valid_output_rate)],['标为高光的时长',pct(m.predicted_duration_fraction)]]){const d=document.createElement('div');d.className='metric';const strong=document.createElement('strong');strong.textContent=value;d.append(strong,document.createTextNode(name));$('metrics').append(d)}
const head=document.createElement('tr');for(const s of ['时间 IoU','命中/参考','精确率','召回率','F1']){const e=document.createElement('th');e.textContent=s;head.append(e)}$('scores').append(head);
for(const [t,r] of Object.entries(m.iou)){const tr=document.createElement('tr');for(const v of [t,`${r.hits}/${r.targets}`,pct(r.precision),pct(r.recall),pct(r.f1)]){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('scores').append(tr)}
for(const name of [...new Set(rows.map(x=>x.category))]){const o=new Option(name,name);$('category').add(o)}
const names={};for(const row of rows){names[row.drama_id]=row.video.path.split('/').slice(-2,-1)[0]||row.drama_id}for(const [id,name] of Object.entries(names))$('drama').add(new Option(name,id));
let current=null, stopAt=null, selected=null;
function play(start,end,label){const v=$('video');const act=()=>{const origin=current.example_file?current.video.start_sec:0;v.currentTime=Math.max(0,start-origin);stopAt=end-origin;v.play().catch(()=>{});$('status').textContent=label+' · 原片 '+sec(start)+'–'+sec(end)};if(v.readyState)act();else v.addEventListener('loadedmetadata',act,{once:true})}
$('video').addEventListener('timeupdate',()=>{if(stopAt!==null&&$('video').currentTime>=stopAt){$('video').pause();stopAt=null}});
function select(row){current=row;selected=row.sample_id;const v=$('video'),src=row.example_file||'media/'+encodeURIComponent(row.video_id)+'.mp4';if(v.getAttribute('src')!==src)v.src=src;stopAt=null;
$('title').textContent=row.category+' · '+names[row.drama_id];$('meta').textContent=row.video.path.split('/').pop()+' · 本次负责原片 '+sec(row.video.start_sec+row.detect_range.start_sec)+'–'+sec(row.video.start_sec+row.detect_range.end_sec);
$('status').textContent='点击参考或预测区间播放；红框为未覆盖足够参考核心的预测；边界偏差表示找到了核心，但区间重叠不足 0.5。';$('dialogue').textContent=row.dialogue;$('raw').textContent=row.raw_text+(row.error?'\n解析错误：'+row.error:'');
for(const [id,spans] of [['reference',row.reference],['predictions',row.predicted]]){const box=$(id);box.replaceChildren();if(!spans.length)box.textContent=id==='reference'?'参考为空':row.error?'输出无法解析':'模型未选高光';spans.forEach((span,i)=>{const b=document.createElement('button');b.className=id==='reference'?'reference':row.false.includes(i)?'prediction bad':'prediction';b.textContent=sec(span.start_sec+row.video.start_sec)+'–'+sec(span.end_sec+row.video.start_sec);b.onclick=()=>play(span.start_sec+row.video.start_sec,span.end_sec+row.video.start_sec,id==='reference'?'参考高光':'模型预测');box.append(b)})}
$('context').onclick=()=>play(row.video.start_sec,row.video.end_sec,'完整观看窗口');renderList(false)}
function renderList(choose=true){const query=$('search').value.toLowerCase();const filtered=rows.filter(r=>(!$('category').value||r.category===$('category').value)&&(!$('drama').value||r.drama_id===$('drama').value)&&(!query||(r.video.path+' '+r.dialogue).toLowerCase().includes(query)));$('count').textContent=`${filtered.length} / ${rows.length} 个窗口`;$('list').replaceChildren();for(const row of filtered){const b=document.createElement('button');b.className='row'+(row.sample_id===selected?' active':'');b.textContent=row.category+' · '+names[row.drama_id]+' · '+sec(row.video.start_sec+row.detect_range.start_sec);b.onclick=()=>select(row);$('list').append(b)}if(choose&&filtered.length)select(filtered[0])}
for(const id of ['category','drama','search'])$(id).addEventListener('input',()=>renderList());renderList();
</script></html>
