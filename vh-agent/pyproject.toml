[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vh-agent"
version = "0.21.0"
description = "Native-video ReAct highlight agent for short dramas"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "pysubs2>=1.8,<2",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "scenedetect>=0.6.7,<0.7",
  "opencv-contrib-python>=4.10,<4.11",
]

[project.optional-dependencies]
enhanced = [
  "faster-whisper>=1.1,<2",
  "paddlepaddle>=3,<4",
  "paddleocr>=3.7,<4",
]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
vh = "vh_agent.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vh_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
